<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expresá tu idea</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section class="idea">

            <div class="contenedor">

                <h1>
                    Expresá tu idea.
                    <span>El Agente Hostinger se encarga del resto</span>
                </h1>

                <p class="descripcion">
                    Contanos qué querés crear y empezá a darle vida a tu proyecto.
                </p>

                <div class="formulario">

                    <input
                        type="text"
                        placeholder="¿Qué te gustaría crear hoy?"
                    >

                    <button type="button">
                        →
                    </button>

                </div>

                <p class="aclaracion">
                    Obtené ideas para tu sitio web en pocos minutos.
                </p>

            </div>

        </section>

    </main>

</body>

</html>
