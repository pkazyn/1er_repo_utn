<!DOCTYPE html>
<html lang="en"> <!-- contiene todo el html, todas las etiquetas van dentro de estas -->
    <head> <!-- hace referencia  a los metadatos del html -->
    <meta charset="UTF-8"> <!-- es la config de caracteres, como renderiza los caracteres el navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- adaptacion del viewport al ancho del dispositivo -->
    <title> mi primera pagina web</title><!--  es el titulo de la pagina, lo que aparece en la pestaña del navegador -->
    </head>
    <body><!-- hace referencia al contenido de la pagina  -->
        <h1> estoy turbo sacado</h1> <!-- es un encabezado de primer nivel, el mas important -->
    </body>
</html>
